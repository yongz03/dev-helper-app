apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-helper-api-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-helper-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-helper-api
  template:
    metadata:
      labels:
        app: dev-helper-api
    spec:
      securityContext:
        fsGroup: 1654
      containers:
        - name: api
          image: ghcr.io/yongz03/dev-helper-app-api:87fa9717b8a8d00ca22860fa49b31dfec033a2ae
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/data/devhelper.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /weatherforecast
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /weatherforecast
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dev-helper-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: dev-helper-api
spec:
  selector:
    app: dev-helper-api
  ports:
    - name: http
      port: 8080
      targetPort: http
