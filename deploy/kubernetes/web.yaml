apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-helper-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-helper-web
  template:
    metadata:
      labels:
        app: dev-helper-web
    spec:
      containers:
        - name: web
          image: ghcr.io/yongz03/dev-helper-app-web:87fa9717b8a8d00ca22860fa49b31dfec033a2ae
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dev-helper-web
spec:
  type: LoadBalancer
  selector:
    app: dev-helper-web
  ports:
    - name: http
      port: 80
      targetPort: http
