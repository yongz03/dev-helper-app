name: CI and deploy

on:
  pull_request:
    paths-ignore:
      - deploy/kubernetes/**
      - README.md
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - deploy/kubernetes/**
      - README.md
      - '**/*.md'
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: Commit SHA tag of the published API image to deploy
        required: true
        default: cc83ad2a9d4ab5ca60d5f2df0c555843acfbdf16
      web_image_tag:
        description: Commit SHA tag of the published web image to deploy
        required: true
        default: 1251e1dc43b4ddda3745d53e3d268be548268473

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api-to-render:
    name: Deploy selected API image to Render
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/yongz03/dev-helper-app-api:${{ inputs.api_image_tag }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub Actions secret RENDER_API_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"

  deploy-web-to-render:
    name: Deploy selected web image to Render
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/yongz03/dev-helper-app-web:${{ inputs.web_image_tag }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub Actions secret RENDER_WEB_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet restore DevHelper.sln
      - run: dotnet build DevHelper.sln --no-restore --configuration Release
      - run: dotnet test DevHelper.sln --no-build --configuration Release
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: client

  publish-and-update:
    name: Publish images and update GitOps manifests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          echo "api=ghcr.io/${owner}/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/${repository}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish API image
        run: |
          docker build -f api/Dockerfile -t "${{ steps.image.outputs.api }}:${{ steps.image.outputs.tag }}" .
          docker push "${{ steps.image.outputs.api }}:${{ steps.image.outputs.tag }}"
      - name: Build and publish web image
        run: |
          docker build -f client/Dockerfile -t "${{ steps.image.outputs.web }}:${{ steps.image.outputs.tag }}" .
          docker push "${{ steps.image.outputs.web }}:${{ steps.image.outputs.tag }}"
      - name: Deploy API image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.image.outputs.api }}:${{ steps.image.outputs.tag }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub Actions secret RENDER_API_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"
      - name: Deploy web image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.image.outputs.web }}:${{ steps.image.outputs.tag }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing GitHub Actions secret RENDER_WEB_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"
      - name: Update deployment image references
        env:
          API_IMAGE: ${{ steps.image.outputs.api }}
          WEB_IMAGE: ${{ steps.image.outputs.web }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          sed -i "s|image: .*|image: ${API_IMAGE}:${IMAGE_TAG}|" deploy/kubernetes/api.yaml
          sed -i "s|image: .*|image: ${WEB_IMAGE}:${IMAGE_TAG}|" deploy/kubernetes/web.yaml
      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kubernetes/api.yaml deploy/kubernetes/web.yaml
          git commit -m "chore(deploy): publish ${GITHUB_SHA::7}" || exit 0
          git push
